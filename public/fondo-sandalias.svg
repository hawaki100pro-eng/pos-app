<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460">
  <!-- Fondo de la tienda: sandalias blancas sobre rosado, repetido como mosaico.
       El mosaico mide 460x460 y ninguna sandalia toca el borde, así que al repetirse no se cortan. -->
  <defs>
    <g id="sandalia" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round">
      <rect x="-28" y="-59" width="56" height="118" rx="28"/>
      <rect x="-21" y="-52" width="42" height="104" rx="21"/>
      <path d="M-27 -20 Q0 -28 27 -20"/>
      <path d="M-28 6 Q0 -2 28 6"/>
    </g>
  </defs>

  <rect width="460" height="460" fill="#ef5c98"/>

  <use href="#sandalia" transform="translate(58,72) rotate(-16)"/>
  <use href="#sandalia" transform="translate(222,84) rotate(13)"/>
  <use href="#sandalia" transform="translate(378,68) rotate(-7)"/>

  <use href="#sandalia" transform="translate(72,232) rotate(20)"/>
  <use href="#sandalia" transform="translate(238,220) rotate(-24)"/>
  <use href="#sandalia" transform="translate(392,240) rotate(9)"/>

  <use href="#sandalia" transform="translate(55,388) rotate(6)"/>
  <use href="#sandalia" transform="translate(215,376) rotate(-14)"/>
  <use href="#sandalia" transform="translate(368,392) rotate(17)"/>
</svg>
