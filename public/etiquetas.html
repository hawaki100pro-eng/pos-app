<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiquetas — Hawaki POS</title>
  <link rel="stylesheet" href="etiquetas.css">
  <!-- La regla del tamaño de página la escribe etiquetas.js según el modo elegido -->
  <style id="regla-pagina"></style>
</head>
<body data-modo="rollo">

  <div class="barra">
    <h1 id="titulo">Etiquetas</h1>
    <span class="cuenta" id="cuenta"></span>

    <label class="opcion">
      Imprimir en
      <select id="modo">
        <option value="rollo">Rollo (una por página)</option>
        <option value="hoja">Hoja A4</option>
      </select>
    </label>

    <label class="opcion">
      <input type="checkbox" id="una-por-par" checked>
      Una etiqueta por par
    </label>

    <button id="imprimir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <path d="M6 14h12v8H6z"/>
      </svg>
      Imprimir
    </button>
  </div>

  <div class="aviso">
    <strong>Antes de imprimir de verdad:</strong> saca una prueba en papel normal, mídela con una regla
    (cada etiqueta debe dar 40 × 20 mm) y pásale el lector. Si sale de otro tamaño, en el diálogo de
    impresión pon la escala en <strong>100 %</strong> y desactiva «ajustar a la página».
  </div>

  <div class="hoja" id="hoja"></div>

  <script src="codigos.js"></script>
  <script src="etiquetas.js"></script>
</body>
</html>
